<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #fcf9f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* Interactive Invitation Card Frame */
        .invitation-slider {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border-radius: 16px;
            overflow: hidden;
        }
        .slide-item {
            display: none;
            width: 100%;
        }
        .slide-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Navigation Controls Overlay */
        .slider-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #f0e9dc;
        }
        .control-btn {
            background-color: #3d5a45;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            min-width: 90px;
            text-align: center;
        }
        .control-btn:hover {
            background-color: #2b3f30;
        }
        .control-btn:active {
            transform: scale(0.97);
        }
        /* Fixed RSVP Link Section */
        .rsvp-footer {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 24px;
        }
        .rsvp-link-btn {
            display: inline-block;
            background-color: #bc903c;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(188, 144, 60, 0.3);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .rsvp-link-btn:hover {
            background-color: #9e772f;
            transform: translateY(-2px);
        }
        .rsvp-link-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Invitation Card Frame -->
    <div class="invitation-slider">
        <!-- Card 1: Temple Theme Cover -->
        <div class="slide-item">
            <img src="image_w6JIXe.png" alt="Traditional Temple Cover Graphic">
        </div>
        
        <!-- Card 2: December 3rd - Maapillai Azhaippu -->
        <div class="slide-item">
            <img src="image_Vp6zYa.png" alt="Maapillai Azhaippu Event Card">
        </div>

        <!-- Card 3: December 4th - Main Muhurtham Wedding -->
        <div class="slide-item">
            <img src="image_U3jU8C.png" alt="Main Wedding Invitation Card">
        </div>

        <!-- Navigation Controls -->
        <div class="slider-controls">
            <button class="control-btn" id="backwardBtn" onclick="navigateSlides(-1)">◀ Back</button>
            <button class="control-btn" id="playPauseBtn" onclick="toggleAutoplay()">⏸ Pause</button>
            <button class="control-btn" id="forwardBtn" onclick="navigateSlides(1)">Next ▶</button>
        </div>
    </div>

    <!-- RSVP Link Section -->
    <div class="rsvp-footer">
        <a href="https://withjoy.com/rishitadithya/rsvp" target="_blank" class="rsvp-link-btn">
            Click Here to RSVP
        </a>
    </div>

    <!-- Control Operations & Autoplay Logic -->
    <script>
        let currentSlide = 0;
        let autoplayTimer;
        let isAutoplayActive = true;
        const slideDuration = 4000; // Changes card every 4 seconds

        const allSlides = document.getElementsByClassName("slide-item");
        const playPauseButton = document.getElementById("playPauseBtn");

        function renderSlide() {
            // Hide all cards
            for (let i = 0; i < allSlides.length; i++) {
                allSlides[i].style.display = "none";  
            }
            // Loop check boundaries
            if (currentSlide >= allSlides.length) { currentSlide = 0; }
            if (currentSlide < 0) { currentSlide = allSlides.length - 1; }
            
            // Display active card
            allSlides[currentSlide].style.display = "block";  
        }

        function triggerNextSlide() {
            currentSlide++;
            renderSlide();
        }

        function startAutoplay() {
            autoplayTimer = setInterval(triggerNextSlide, slideDuration);
        }

        function clearAutoplay() {
            clearInterval(autoplayTimer);
        }

        function navigateSlides(direction) {
            clearAutoplay();
            currentSlide += direction;
            renderSlide();
            if (isAutoplayActive) {
                startAutoplay();
            }
        }

        function toggleAutoplay() {
            if (isAutoplayActive) {
                clearAutoplay();
                playPauseButton.innerHTML = "▶ Play";
                isAutoplayActive = false;
            } else {
                currentSlide++;
                renderSlide();
                startAutoplay();
                playPauseButton.innerHTML = "⏸ Pause";
                isAutoplayActive = true;
            }
        }

        // Initialize execution on load
        renderSlide();
        startAutoplay();
    </script>

</body>
</html>
