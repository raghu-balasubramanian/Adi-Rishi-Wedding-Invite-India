<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #f5eedc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            -webkit-text-size-adjust: 100%;
        }
        /* Mobile-First Floating Layout Frame */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border-radius: 16px;
            overflow: hidden;
        }
        .slide-item {
            display: none;
            width: 100%;
            animation: fadeIn 0.4s ease-in-out;
        }
        .slide-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Temple Clickable Wrapper Styling */
        .temple-click-wrapper {
            cursor: pointer;
            width: 100%;
            position: relative;
        }

        /* Customized RSVP Screen Matching the Provided Image */
        .rsvp-slide-content {
            background-color: #f7ebd3; /* Warm cream background */
            padding: 70px 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 450px;
        }
        .rsvp-names {
            color: #6a1b29; /* Maroon text style */
            font-size: 32px;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 35px;
        }
        .rsvp-link-btn {
            display: inline-block;
            background-color: #6a1b29; /* Deep maroon button */
            color: #ffffff;
            text-decoration: none;
            padding: 14px 55px;
            font-size: 18px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(106, 27, 41, 0.2);
            border: 1px solid #54121e;
            -webkit-appearance: none;
            margin-bottom: 35px;
            cursor: pointer;
        }
        .rsvp-subtitle {
            color: #4a3b2c;
            font-size: 16px;
            font-style: italic;
            line-height: 1.5;
            max-width: 280px;
            margin-bottom: 50px;
        }
        .replay-link {
            color: #5d4e3c;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        /* OPAQUE FLOATING CONTROLS OVERLAY */
        .slider-controls {
            position: absolute;
            bottom: 25px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 100;
            background: #ffffff; /* Completely 100% solid white opaque backdrop */
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid #e2d9c5;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); /* Soft drop shadow to make it pop neatly */
            transition: opacity 0.3s ease;
        }
        .control-btn {
            background-color: #3d5a45; /* Clean sage green layout color */
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-appearance: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .control-btn:hover {
            background-color: #2b3f30;
        }
        @keyframes fadeIn {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Target Audio File -->
    <audio id="bgMusic" src="music.mp3.mp4" loop preload="auto"></audio>

    <!-- Main Container Box -->
    <div class="slider-container">
        <!-- Slide 0: Temple Theme Cover -->
        <div class="slide-item">
            <div class="temple-click-wrapper" onclick="startOnTempleClick()">
                <img src="temple.png" alt="Traditional Temple Cover">
            </div>
        </div>
        
        <!-- Slide 1: Maapillai Azhaippu -->
        <div class="slide-item">
            <img src="maapillai.png" alt="Maapillai Azhaippu Event">
        </div>

        <!-- Slide 2: Main Marriage Card -->
        <div class="slide-item">
            <img src="marriage.png" alt="Main Wedding Card">
        </div>

        <!-- Slide 3: Styled RSVP Custom Screen -->
        <div class="slide-item">
            <div class="rsvp-slide-content">
                <h1 class="rsvp-names">Rishita & Adithya</h1>
                
                <a href="https://withjoy.com" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="rsvp-link-btn" 
                   onclick="window.open('https://withjoy.com', '_blank'); return false;">
                    RSVP
                </a>
                
                <p class="rsvp-subtitle">Please RSVP to help us plan our celebrations</p>
                
                <button class="replay-link" onclick="restartSlideshow()">View Invitation Again</button>
            </div>
        </div>

        <!-- Floating Controls Frame Layer -->
        <div class="slider-controls" id="controlsToolbar">
            <button class="control-btn" onclick="navigateSlides(-1)" aria-label="Backward">◀</button>
            <button class="control-btn" id="playPauseBtn" onclick="toggleAutoplay()" aria-label="Pause">⏸</button>
            <button class="control-btn" onclick="navigateSlides(1)" aria-label="Forward">▶</button>
        </div>
    </div>
    <script>
        let currentSlide = 0;
        let autoplayTimer;
        let musicTimeout;
        let isAutoplayActive = true;
        let isFirstLaunch = true; /* Lock initial Temple screen behavior */
        const slideDuration = 4000; 

        const allSlides = document.getElementsByClassName("slide-item");
        const playPauseButton = document.getElementById("playPauseBtn");
        const controlsToolbar = document.getElementById("controlsToolbar");
        const music = document.getElementById("bgMusic");

        function renderSlide() {
            if (allSlides.length === 0) return;
            
            if (currentSlide >= allSlides.length) { currentSlide = 0; }
            if (currentSlide < 0) { currentSlide = allSlides.length - 1; }

            for (let i = 0; i < allSlides.length; i++) {
                allSlides[i].style.display = "none";  
            }
            
            allSlides[currentSlide].style.display = "block";  

            /* Hide toolbar on Temple (0) and RSVP (3) */
            if (currentSlide === 0 || currentSlide === 3) {
                controlsToolbar.style.display = "none";
            } else {
                controlsToolbar.style.display = "flex";
            }

            /* Stop music on RSVP page after 5 seconds */
            clearTimeout(musicTimeout);
            if (currentSlide === 3) {
                clearAutoplay(); 
                
                musicTimeout = setTimeout(function() {
                    if (music && !music.paused) {
                        music.pause();
                        playPauseButton.innerHTML = "▶";
                    }
                }, 5000);
            }
        }

        /* Triggered when tapping anywhere on Temple Card Cover */
        function startOnTempleClick() {
            if (isFirstLaunch) {
                isFirstLaunch = false;
                isAutoplayActive = true;
                playPauseButton.innerHTML = "⏸";
                kickstartAudio();
                triggerNextSlide();
                startAutoplay();
            }
        }

        function triggerNextSlide() {
            currentSlide++;
            renderSlide();
        }

        function startAutoplay() {
            if (!isFirstLaunch && currentSlide !== 3) {
                autoplayTimer = setInterval(triggerNextSlide, slideDuration);
            }
        }

        function clearAutoplay() {
            clearInterval(autoplayTimer);
        }

        function navigateSlides(direction) {
            clearAutoplay();
            kickstartAudio();
            currentSlide += direction;
            renderSlide();
            if (isAutoplayActive && currentSlide !== 3) {
                startAutoplay();
            }
        }

        function toggleAutoplay() {
            if (isAutoplayActive) {
                clearAutoplay();
                if (music) music.pause();
                playPauseButton.innerHTML = "▶";
                isAutoplayActive = false;
            } else {
                isAutoplayActive = true;
                playPauseButton.innerHTML = "⏸";
                if (music && currentSlide !== 3) {
                    music.play().catch(err => console.log("Audio resume caught"));
                }
                renderSlide(); 
                if (currentSlide !== 3) {
                    startAutoplay();
                }
            }
        }

        function restartSlideshow() {
            clearAutoplay();
            currentSlide = 0;
            isFirstLaunch = true; /* Reset lock until clicked */
            isAutoplayActive = true;
            playPauseButton.innerHTML = "⏸";
            renderSlide();
            if (music) {
                music.currentTime = 0;
                music.play().catch(err => console.log("Audio reset caught"));
            }
        }

        function kickstartAudio() {
            if (music && music.paused && isAutoplayActive && currentSlide !== 3) {
                music.play().catch(err => console.log("Audio kickstart caught"));
            }
        }

        document.addEventListener('touchstart', kickstartAudio, { once: true });
        document.addEventListener('click', kickstartAudio, { once: true });

        window.onload = function() {
            renderSlide();
        };
    </script>
</body>
</html>
