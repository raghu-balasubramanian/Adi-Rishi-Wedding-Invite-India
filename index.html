<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #fcf9f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-text-size-adjust: 100%;
        }
        /* Mobile-First Layout Frame */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border-radius: 16px;
            overflow: hidden;
        }
        /* Forces clean rendering rules on iPhone */
        .slide-item {
            display: none;
            width: 100%;
            animation: fadeIn 0.4s ease-in-out;
        }
        .slide-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Audio and Navigation Control Dashboard */
        .slider-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid #f0e9dc;
        }
        .control-btn {
            background-color: #3d5a45;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            min-width: 90px;
            text-align: center;
            -webkit-appearance: none; /* Disables default iOS styling override */
        }
        .control-btn:hover {
            background-color: #2b3f30;
        }
        /* RSVP Link Area */
        .rsvp-footer {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 24px;
        }
        .rsvp-link-btn {
            display: inline-block;
            background-color: #bc903c;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(188, 144, 60, 0.3);
            -webkit-appearance: none;
        }
        @keyframes fadeIn {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- HTML5 Audio Core (Add your music filename here) -->
    <audio id="bgMusic" src="./wedding_music.mp3" loop preload="auto"></audio>

    <!-- Main Card Display Frame -->
    <div class="slider-container">
        <!-- Card 1: Traditional Temple Cover -->
        <div class="slide-item">
            <img src="./image_w6JIXe.png" alt="Traditional Temple Cover">
        </div>
        
        <!-- Card 2: Maapillai Azhaippu (Haldi/Event) -->
        <div class="slide-item">
            <img src="./image_Vp6zYa.png" alt="Maapillai Azhaippu Event">
        </div>

        <!-- Card 3: Main Wedding Muhurtham -->
        <div class="slide-item">
            <img src="./image_U3jU8C.png" alt="Main Wedding Card">
        </div>

        <!-- Navigation Controls Toolbar -->
        <div class="slider-controls">
            <button class="control-btn" onclick="navigateSlides(-1)">◀ Back</button>
            <button class="control-btn" id="playPauseBtn" onclick="toggleAutoplay()">⏸ Pause</button>
            <button class="control-btn" onclick="navigateSlides(1)">Next ▶</button>
        </div>
    </div>

    <!-- RSVP Redirect Section -->
    <div class="rsvp-footer">
        <a href="https://withjoy.com" target="_blank" rel="noopener noreferrer" class="rsvp-link-btn" onclick="kickstartAudio()">
            Click Here to RSVP
        </a>
    </div>

    <!-- Slider & iOS Audio Engine Optimization -->
    <script>
        let currentSlide = 0;
        let autoplayTimer;
        let isAutoplayActive = true;
        const slideDuration = 4000; 

        const allSlides = document.getElementsByClassName("slide-item");
        const playPauseButton = document.getElementById("playPauseBtn");
        const music = document.getElementById("bgMusic");

        // Safe Rendering Engine for iOS Safari
        function renderSlide() {
            if (allSlides.length === 0) return;

            // Handle boundaries cleanly without crashing execution
            if (currentSlide >= allSlides.length) { currentSlide = 0; }
            if (currentSlide < 0) { currentSlide = allSlides.length - 1; }

            for (let i = 0; i < allSlides.length; i++) {
                allSlides[i].style.display = "none";  
            }
            
            allSlides[currentSlide].style.display = "block";  
        }

        function triggerNextSlide() {
            currentSlide++;
            renderSlide();
        }

        function startAutoplay() {
            autoplayTimer = setInterval(triggerNextSlide, slideDuration);
        }

        function clearAutoplay() {
            clearInterval(autoplayTimer);
        }

        function navigateSlides(direction) {
            clearAutoplay();
            kickstartAudio(); // Unlock audio on manual click
            currentSlide += direction;
            renderSlide();
            if (isAutoplayActive) {
                startAutoplay();
            }
        }

        function toggleAutoplay() {
            if (isAutoplayActive) {
                clearAutoplay();
                music.pause();
                playPauseButton.innerHTML = "▶ Play";
                isAutoplayActive = false;
            } else {
                kickstartAudio();
                currentSlide++;
                renderSlide();
                startAutoplay();
                playPauseButton.innerHTML = "⏸ Pause";
                isAutoplayActive = true;
            }
        }

        // Bypasses iOS Autoplay Restrictions on first user interaction
        function kickstartAudio() {
            if (music && music.paused && isAutoplayActive) {
                music.play().catch(function(error) {
                    console.log("Audio kickstart caught: ", error);
                });
            }
        }

        // Global touch unlock for iPhone user profiles
        document.addEventListener('touchstart', kickstartAudio, { once: true });
        document.addEventListener('click', kickstartAudio, { once: true });

        // Force initial initialization
        document.addEventListener("DOMContentLoaded", function() {
            renderSlide();
            startAutoplay();
        });
    </script>

</body>
</html>
