<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        /* Base Global Constraints */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #f6f4ee;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Mobile Layout Shell Container */
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.15);
        }

        /* FRONT COVER LAYER: Full screen gate overlay */
        .temple-gate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 1000;
            cursor: pointer;
            visibility: visible;
            opacity: 1;
            transition: opacity 0.5s ease 3.5s, visibility 0s linear 4s;
        }

        /* Split-Window Panels holding half the temple image each */
        .gate-door-panel {
            width: 50%;
            height: 100%;
            position: relative;
            overflow: hidden;
            transition: transform 3.5s cubic-bezier(0.45, 0, 0.55, 1);
        }
        .gate-door-panel img {
            position: absolute;
            top: 0;
            height: 100%;
            width: 200%; 
            max-width: none;
            object-fit: cover;
        }

        /* Left and Right Side Image Alignment rules */
        .gate-door-panel.left { transform-origin: left center; }
        .gate-door-panel.left img { left: 0; }
        .gate-door-panel.right { transform-origin: right center; }
        .gate-door-panel.right img { right: 0; }

        /* Slide Transitions when 'is-open' class is added */
        .temple-gate-overlay.is-open .gate-door-panel.left { transform: translateX(-100%); }
        .temple-gate-overlay.is-open .gate-door-panel.right { transform: translateX(100%); }
        .temple-gate-overlay.is-open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Floating Tap Prompt Indicator Button */
        .tap-prompt-banner {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #d4af37;
            padding: 12px 34px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #8b0000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            animation: bouncePrompt 2.5s infinite;
            pointer-events: none;
            text-align: center;
            z-index: 1010;
        }
        .temple-gate-overlay.is-open .tap-prompt-banner { opacity: 0; }

        /* Slideshow Viewport Container */
        .slides-viewport {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .invitation-page-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 15px 100px 15px;
            background: #fff;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .invitation-page-slide.active-slide {
            opacity: 1;
            visibility: visible;
        }

        /* Typography & Card Container Formatting */
        .wedding-main-title {
            margin: 10px 0 15px 0;
            color: #8b0000;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-align: center;
        }
        .invitation-card-img {
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        /* Isolated RSVP Page Block */
        .rsvp-card-block {
            width: 100%;
            background: #fffcf5;
            border: 1px double #d4af37;
            padding: 30px 20px;
            margin-top: 40px;
            border-radius: 6px;
            text-align: center;
        }
        .rsvp-action-link, .replay-action-btn {
            display: inline-block;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .rsvp-action-link:hover, .replay-action-btn:hover { background: #a30000; }

        /* Floating Nav & Media Controls Bar (◀ ⏸ ▶) */
        .audio-player-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 0, 0, 0.96);
            border: 1px solid #d4af37;
            padding: 10px 28px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 30px;
            z-index: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .audio-control-node {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        @keyframes bouncePrompt {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) translateY(-4px) scale(1.02); }
        }
    </style>
</head>
<body>

<div class="invitation-container">

    <!-- FRONT COVER OVERLAY: Split doors mapping directly to temple.png -->
    <div class="temple-gate-overlay" id="templeGate" onclick="executeGateOpening()">
        <div class="gate-door-panel left">
            <img src="temple.png" alt="Temple Cover Left">
        </div>
        <div class="gate-door-panel right">
            <img src="temple.png" alt="Temple Cover Right">
        </div>
        <div class="tap-prompt-banner">▲<br>Tap to Enter</div>
    </div>

    <!-- MAIN INTERACTIVE SLIDESHOW FRAMES -->
    <div class="slides-viewport">
        
        <!-- PAGE 1: Main Wedding Invitation Card (renamed to marriage.png) -->
        <div class="invitation-page-slide active-slide" id="slide0">
            <h1 class="wedding-main-title">Rishita & Adithya</h1>
            <img src="marriage.png" alt="Rishita & Adithya Wedding Invitation" class="invitation-card-img">
        </div>
        
        <!-- PAGE 2: Maapillai Azhaippu Event details -->
        <div class="invitation-page-slide" id="slide1">
            <h1 class="wedding-main-title">Rishita & Adithya</h1>
            <img src="maapillai.png" alt="Maapillai Azhaippu Details" class="invitation-card-img">
        </div>
        
        <!-- PAGE 3: Final Isolated RSVP Page with Reset Loop Trigger -->
        <div class="invitation-page-slide" id="slide2">
            <div class="rsvp-card-block">
                <h2 style="color: #8b0000; margin-bottom: 10px;">RSVP</h2>
                <p style="font-size: 1rem; color: #666; line-height: 1.5;">Please RSVP to help us plan our celebrations</p>
                <a href="https://withjoy.com" class="rsvp-action-link" onclick="handleRSVPSubmission(event)">Respond Here</a>
            </div>
            
            <div style="margin-top: 40px;">
                <button class="replay-action-btn" style="background: #666;" onclick="triggerAutoOpenReset()">View Invitation Again</button>
            </div>
        </div>

    </div>

    <!-- FLOATING MULTIMEDIA PLAYER FOOTER HUB (◀ ⏸ ▶) -->
    <div class="audio-player-controls">
        <button class="audio-control-node" onclick="navigateSlide(-1)">◀</button>
        <button class="audio-control-node" id="playPauseBtn" onclick="toggleAudioPlayback()">⏸</button>
        <button class="audio-control-node" onclick="navigateSlide(1)">▶</button>
    </div>

</div>

<!-- Hidden Background Audio Player Core Instance -->
<audio id="bgMusic" src="music.mp3.mp4" loop></audio>

<script>
    const gateOverlay = document.getElementById('templeGate');
    const audioTrack = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    
    let currentSlideIndex = 0;
    const totalSlidesCount = 3;
    let isTrackPlaying = false;

    // Checks local session memory state to determine if gate should auto-open on load
    window.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('autoOpenTemple') === 'true') {
            sessionStorage.removeItem('autoOpenTemple'); // Clean state tracking
            gateOverlay.classList.add('is-open');
            startAudioStream();
        }
    });

    // Opens curtain panels gracefully on guest click engagement
    function executeGateOpening() {
        gateOverlay.classList.add('is-open');
        if (!isTrackPlaying) {
            startAudioStream();
        }
    }

    // Handles sequential page sliding updates via control arrows
    function navigateSlide(direction) {
        document.getElementById(`slide${currentSlideIndex}`).classList.remove('active-slide');
        
        currentSlideIndex += direction;
        
        // Loop boundary constraints protection
        if (currentSlideIndex >= totalSlidesCount) {
            currentSlideIndex = 0;
        } else if (currentSlideIndex < 0) {
            currentSlideIndex = totalSlidesCount - 1;
        }
        
        document.getElementById(`slide${currentSlideIndex}`).classList.add('active-slide');
    }

    // Forceful Device-Agnostic RSVP Link Redirect & Music Killer
    function handleRSVPSubmission(event) {
        event.preventDefault();
        
        // Kill music playback cleanly upon RSVP submit action
        audioTrack.pause();
        playPauseBtn.innerText = "▶";
        isPlaying = false;
        
        // Enforce fallback location routing redirection across any user handset device
        window.location.href = "https://withjoy.com";
    }

    // Stores auto-open command to state registry and drops browser page frame refresh
    function triggerAutoOpenReset() {
        sessionStorage.setItem('autoOpenTemple', 'true');
        window.location.reload();
    }

    /* Background Playback Engine Stream Controls */
    function startAudioStream() {
        audioTrack.play().then(() => {
            isTrackPlaying = true;
            playPauseBtn.innerText = "⏸";
        }).catch(err => {
            console.log("Device background audio initializing requires user context interaction.");
        });
    }

    function toggleAudioPlayback() {
        if (isTrackPlaying) {
            audioTrack.pause();
            playPauseBtn.innerText = "▶";
            isTrackPlaying = false;
        } else {
            startAudioStream();
        }
    }
</script>

</body>
</html>
