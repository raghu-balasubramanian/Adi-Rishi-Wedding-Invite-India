<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #f7f5f0;
            color: #333;
            overflow: hidden;
        }

        /* Mobile-Sized Content Container Sandbox */
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.15);
            background: #fff;
        }

        /* Temple Gate Full-Screen Interactive Shell */
        .temple-gate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            cursor: pointer;
            z-index: 1000;
            opacity: 1;
            /* Ensures total clearance after sliding finishes */
            transition: opacity 0.5s ease 2.5s, visibility 0s linear 3s; 
        }
        
        /* Automatic 50/50 split of the image_chvh-Z.png file across doors */
        .gate-door {
            width: 50%;
            height: 100%;
            background-image: url('image_chvh-Z.png');
            background-size: 200% 100%;
            background-repeat: no-repeat;
            transition: transform 2.5s cubic-bezier(0.42, 0, 0.58, 1);
        }
        .gate-door.left {
            background-position: left center;
            border-right: 1px dashed rgba(212, 175, 55, 0.3);
        }
        .gate-door.right {
            background-position: right center;
            border-left: 1px dashed rgba(212, 175, 55, 0.3);
        }

        /* Slide mechanics when triggered */
        .temple-gate-overlay.is-open .gate-door.left {
            transform: translateX(-100%);
        }
        .temple-gate-overlay.is-open .gate-door.right {
            transform: translateX(100%);
        }
        
        /* Collapse overlay entirely so it cannot block scrolling or tapping */
        .temple-gate-overlay.is-open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Entry Hint Banner */
        .tap-prompt {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d4af37;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #8b0000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: bounceIndicator 2.5s infinite;
            pointer-events: none;
            transition: opacity 0.4s ease;
            text-align: center;
        }
        .temple-gate-overlay.is-open .tap-prompt {
            opacity: 0;
        }

        /* Scrollable Invitation Inner Viewport */
        .main-content {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 25px 15px 120px 15px;
            text-align: center;
            scroll-behavior: smooth;
        }
        .wedding-main-title {
            margin: 10px 0 25px 0;
            color: #8b0000;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .invitation-card-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        /* Action Forms Block Wrapper */
        .rsvp-card-block {
            background: #fffcf5;
            border: 1px double #d4af37;
            padding: 25px 20px;
            margin: 35px 5px;
            border-radius: 6px;
        }
        .rsvp-action-link, .replay-action-btn {
            display: inline-block;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .rsvp-action-link:hover, .replay-action-btn:hover {
            background: #a30000;
        }

        /* Music Controls Player Hub (◀ ⏸ ▶) */
        .audio-player-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 0, 0, 0.96);
            border: 1px solid #d4af37;
            padding: 8px 24px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .audio-control-node {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .audio-control-node:hover {
            color: #d4af37;
        }

        @keyframes bounceIndicator {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) translateY(-4px) scale(1.02); }
        }
    </style>
</head>
<body>

<div class="invitation-container">

    <!-- FRONT COVER OVERLAY: Slides open and hides completely when clicked -->
    <div class="temple-gate-overlay" id="templeGate" onclick="openTempleGates()">
        <div class="gate-door left"></div>
        <div class="gate-door right"></div>
        <div class="tap-prompt">▲<br>Tap to Enter</div>
    </div>

    <!-- INNER WEBPAGE CONTENT LAYOUT: Pages revealed perfectly behind the cover -->
    <div class="main-content" id="mainContent">
        <h1 class="wedding-main-title">Rishita & Adithya</h1>
        
        <!-- Main Wedding Invitation Card -->
        <img src="image_B0Acge.png" alt="Rishita & Adithya Wedding Invitation" class="invitation-card-img">
        
        <!-- Maapillai Azhaippu Event Detail Card -->
        <img src="image_U58_Bq.png" alt="Maapillai Azhaippu Details" class="invitation-card-img">
        
        <!-- RSVP Functional Form Block -->
        <div class="rsvp-card-block">
            <h3 style="color: #8b0000; margin-bottom: 5px;">RSVP</h3>
            <p style="font-size: 0.9rem; color: #666;">Please RSVP to help us plan our celebrations</p>
            <a href="https://your-rsvp-form-url-here.com" target="_blank" class="rsvp-action-link">Respond Here</a>
        </div>

        <!-- Cover Resetter Module -->
        <div style="margin: 20px 0;">
            <button class="replay-action-btn" style="background: #666;" onclick="closeTempleGates()">View Invitation Again</button>
        </div>
    </div>

    <!-- FIXED MEDIA CONTAINER BAR -->
    <div class="audio-player-controls">
        <button class="audio-control-node" onclick="prevTrack()">◀</button>
        <button class="audio-control-node" id="playPauseBtn" onclick="toggleAudio()">⏸</button>
        <button class="audio-control-node" onclick="nextTrack()">▶</button>
    </div>

</div>

<!-- Hidden Background Audio Player Core Instance -->
<audio id="bgMusic" src="audio_track.mp3" loop></audio>

<script>
    const gate = document.getElementById('templeGate');
    const contentPanel = document.getElementById('mainContent');
    const audioTrack = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    
    let isTrackPlaying = false;

    // Triggers splitting transition and plays background audio smoothly
    function openTempleGates() {
        gate.classList.add('is-open');
        if (!isTrackPlaying) {
            startAudioPlayback();
        }
    }

    // Safely pulls doors shut and jumps scroll view back to top
    function closeTempleGates() {
        contentPanel.scrollTop = 0;
        gate.classList.remove('is-open');
    }

    // Media Logic Engine Tools
    function startAudioPlayback() {
        audioTrack.play().then(() => {
            isTrackPlaying = true;
            playPauseBtn.innerText = "⏸";
        }).catch(err => {
            console.log("Device playback engine delayed audio stream initialization until user focus event.");
        });
    }

    function toggleAudio() {
        if (isTrackPlaying) {
            audioTrack.pause();
            playPauseBtn.innerText = "▶";
            isTrackPlaying = false;
        } else {
            startAudioPlayback();
        }
    }

    function nextTrack() { console.log("Next track indexed."); }
    function prevTrack() { console.log("Previous track indexed."); }
</script>

</body>
</html>
