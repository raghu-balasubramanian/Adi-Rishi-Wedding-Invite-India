<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        /* Base Global Constraints */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #f6f4ee;
            overflow: hidden;
        }

        /* Mobile Layout Shell Container */
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.15);
        }

        /* FRONT COVER SHELL: Contains the split-door viewport panels */
        .temple-gate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: 1000;
            cursor: pointer;
            visibility: visible;
            opacity: 1;
            transition: opacity 0.5s ease 3.5s, visibility 0s linear 4s;
        }

        /* Panel Windows that hide/reveal half of the graphic */
        .gate-door-panel {
            width: 50%;
            height: 100%;
            position: relative;
            overflow: hidden;
            transition: transform 3.5s cubic-bezier(0.45, 0, 0.55, 1);
        }

        /* Aligns the native image across both sliding doors */
        .gate-door-panel img {
            position: absolute;
            top: 0;
            height: 100%;
            width: 200%; 
            max-width: none;
            object-fit: cover;
        }

        /* Left Side Alignment Constraints */
        .gate-door-panel.left {
            transform-origin: left center;
        }
        .gate-door-panel.left img {
            left: 0;
        }

        /* Right Side Alignment Constraints */
        .gate-door-panel.right {
            transform-origin: right center;
        }
        .gate-door-panel.right img {
            right: 0;
        }

        /* Execution States: Slides the full panels completely clear */
        .temple-gate-overlay.is-open .gate-door-panel.left {
            transform: translateX(-100%);
        }
        .temple-gate-overlay.is-open .gate-door-panel.right {
            transform: translateX(100%);
        }
        .temple-gate-overlay.is-open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Prompt Action Indicator Link Box */
        .tap-prompt-banner {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #d4af37;
            padding: 12px 34px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #8b0000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            animation: rhythmicPulse 2.5s infinite;
            pointer-events: none;
            transition: opacity 0.4s;
            text-align: center;
            z-index: 1010;
        }
        .temple-gate-overlay.is-open .tap-prompt-banner {
            opacity: 0;
        }

        /* Internal Scrollable Wedding Cards Base */
        .main-content-viewport {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px 15px 120px 15px;
            text-align: center;
            scroll-behavior: smooth;
        }
        .wedding-main-title {
            margin: 15px 0 25px 0;
            color: #8b0000;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .invitation-card-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        /* RSVP Functional Module Form Box Wrapper */
        .rsvp-card-block {
            background: #fffcf5;
            border: 1px double #d4af37;
            padding: 25px 20px;
            margin: 35px 5px;
            border-radius: 6px;
        }
        .rsvp-action-link, .replay-action-btn {
            display: inline-block;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .rsvp-action-link:hover, .replay-action-btn:hover {
            background: #a30000;
        }

        /* Floating Audio Controls Strip (◀ ⏸ ▶) */
        .audio-player-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 0, 0, 0.96);
            border: 1px solid #d4af37;
            padding: 8px 24px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .audio-control-node {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
        }

        @keyframes rhythmicPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) translateY(-4px) scale(1.02); }
        }
    </style>
</head>
<body>

<div class="invitation-container">

    <!-- FRONT COVER LAYER: Splitting gate overlay containing temple.png -->
    <div class="temple-gate-overlay" id="templeGate" onclick="executeGateOpening()">
        <div class="gate-door-panel left">
            <img src="temple.png" alt="Temple Cover Left">
        </div>
        <div class="gate-door-panel right">
            <img src="temple.png" alt="Temple Cover Right">
        </div>
        <div class="tap-prompt-banner">▲<br>Tap to Enter</div>
    </div>

    <!-- MAIN CARDS VIEWPORT LAYOUT: Stacked securely behind the overlay -->
    <div class="main-content-viewport" id="mainContent">
        <h1 class="wedding-main-title">Rishita & Adithya</h1>
        
        <!-- Main Wedding Invitation Image Page -->
        <img src="wedding.png" alt="Rishita & Adithya Wedding Invitation" class="invitation-card-img">
        
        <!-- Maapillai Azhaippu Detail Image Page -->
        <img src="maapillai.png" alt="Maapillai Azhaippu Details" class="invitation-card-img">
        
        <!-- RSVP Functional Form Block Container -->
        <div class="rsvp-card-block">
            <h3 style="color: #8b0000; margin-bottom: 5px;">RSVP</h3>
            <p style="font-size: 0.9rem; color: #666;">Please RSVP to help us plan our celebrations</p>
            <a href="https://your-rsvp-form-url-here.com" target="_blank" class="rsvp-action-link">Respond Here</a>
        </div>

        <!-- Cover Replay Toggle Button -->
        <div style="margin: 20px 0;">
            <button class="replay-action-btn" style="background: #666;" onclick="executeGateClosing()">View Invitation Again</button>
        </div>
    </div>

    <!-- FIXED MULTIMEDIA CONTAINER BAR CONTROLS -->
    <div class="audio-player-controls">
        <button class="audio-control-node" onclick="prevTrack()">◀</button>
        <button class="audio-control-node" id="playPauseBtn" onclick="toggleAudio()">⏸</button>
        <button class="audio-control-node" onclick="nextTrack()">▶</button>
    </div>

</div>

<!-- Hidden Background Audio Player Core Instance -->
<audio id="bgMusic" src="music.mp3.mp4" loop></audio>

<script>
    const gateOverlay = document.getElementById('templeGate');
    const contentScrollPanel = document.getElementById('mainContent');
    const audioTrackInstance = document.getElementById('bgMusic');
    const playPauseBtnNode = document.getElementById('playPauseBtn');
    
    let isTrackPlaying = false;

    // Activates sliding frames and initializes music stream safely
    function executeGateOpening() {
        gateOverlay.classList.add('is-open');
        if (!isTrackPlaying) {
            startAudioStream();
        }
    }

    // Snaps gate closed instantly and returns internal page viewport container to top
    function executeGateClosing() {
        contentScrollPanel.scrollTop = 0;
        gateOverlay.classList.remove('is-open');
    }

    // Media Control Modules
    function startAudioStream() {
        audioTrackInstance.play().then(() => {
            isTrackPlaying = true;
            playPauseBtnNode.innerText = "⏸";
        }).catch(err => {
            console.log("Device background audio initializing requires user context interaction.");
        });
    }

    function toggleAudio() {
        if (isTrackPlaying) {
            audioTrackInstance.pause();
            playPauseBtnNode.innerText = "▶";
            isTrackPlaying = false;
        } else {
            startAudioStream();
        }
    }

    // Fallback control handlers for control mapping loops
    function nextTrack() { console.log("Next track indexed."); }
    function prevTrack() { console.log("Previous track indexed."); }
</script>

</body>
</html>
