<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #f5f2eb;
            color: #333;
            overflow: hidden;
        }

        /* App Container */
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            background: #fff;
        }

        /* Temple Gates Overlay Layer */
        .temple-gate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            cursor: pointer;
            z-index: 1000;
            transition: visibility 0s linear 2.5s;
        }
        .gate-door {
            width: 50%;
            height: 100%;
            background-image: url('temple-cover.png'); /* Replace with your full temple cover asset */
            background-size: 200% 100%;
            background-repeat: no-repeat;
            transition: transform 2.5s cubic-bezier(0.42, 0, 0.58, 1);
        }
        .gate-door.left {
            background-position: left center;
            border-right: 1px solid rgba(212, 175, 55, 0.5);
        }
        .gate-door.right {
            background-position: right center;
            border-left: 1px solid rgba(212, 175, 55, 0.5);
        }

        /* Split States */
        .temple-gate-overlay.is-open .gate-door.left {
            transform: translateX(-100%);
        }
        .temple-gate-overlay.is-open .gate-door.right {
            transform: translateX(100%);
        }
        .temple-gate-overlay.is-open {
            visibility: hidden;
            pointer-events: none;
        }

        /* Tap to Enter Prompt */
        .tap-prompt {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #d4af37;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #8b0000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            animation: bouncePulse 2s infinite;
            pointer-events: none;
            transition: opacity 0.4s;
            text-align: center;
        }
        .temple-gate-overlay.is-open .tap-prompt {
            opacity: 0;
        }

        /* Revealed Invitation Content Layout */
        .main-content {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px 20px 80px 20px;
            text-align: center;
            scroll-behavior: smooth;
        }
        .wedding-header {
            margin: 20px 0;
            color: #8b0000;
            font-size: 1.8rem;
        }
        .invitation-card-img {
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        /* Music Floating Controller Bar */
        .audio-player-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 0, 0, 0.95);
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .audio-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .audio-btn:hover {
            color: #d4af37;
        }

        /* RSVP Action Section */
        .rsvp-section {
            background: #fff8eb;
            border: 1px dashed #d4af37;
            padding: 20px;
            margin: 30px 0;
            border-radius: 8px;
        }
        .rsvp-btn, .action-btn {
            display: inline-block;
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .rsvp-btn:hover, .action-btn:hover {
            background: #a30000;
        }

        /* Keyframes */
        @keyframes bouncePulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) translateY(-5px) scale(1.03); }
        }
    </style>
</head>
<body>

<div class="invitation-container">

    <!-- FRONT COVER LAYER: Slow splitting gate mechanism -->
    <div class="temple-gate-overlay" id="templeGate" onclick="handleGateClick()">
        <div class="gate-door left"></div>
        <div class="gate-door right"></div>
        <div class="tap-prompt">▲<br>Tap to Enter</div>
    </div>

    <!-- MAIN CARDS LAYER: Everything revealed after splitting -->
    <div class="main-content" id="mainContent">
        <h1 class="wedding-header"># Rishita & Adithya</h1>
        
        <!-- Main Wedding Card Panel (image_vS8MLQ.png) -->
        <img src="main-wedding-card.png" alt="Main Wedding Card" class="invitation-card-img">
        
        <!-- Maapillai Azhaippu Panel (image_ZF6OCs.png) -->
        <img src="maapillai-azhaippu.png" alt="Maapillai Azhaippu Event" class="invitation-card-img">
        
        <!-- Interactive RSVP Panel -->
        <div class="rsvp-section">
            <h3 style="color: #8b0000; margin-bottom: 5px;">RSVP</h3>
            <p style="font-size: 0.9rem; color: #555;">Please RSVP to help us plan our celebrations</p>
            <a href="https://your-rsvp-link.com" target="_blank" class="rsvp-btn">Submit RSVP</a>
        </div>

        <!-- Reset Feature Panel -->
        <div style="margin: 20px 0;">
            <button class="action-btn" style="background: #555;" onclick="resetInvitation()">View Invitation Again</button>
        </div>
    </div>

    <!-- MUSIC CONTROLLER FLOATING HEADER (◀ ⏸ ▶) -->
    <div class="audio-player-bar">
        <button class="audio-btn" onclick="prevTrack()">◀</button>
        <button class="audio-btn" id="playPauseBtn" onclick="togglePlayPause()">⏸</button>
        <button class="audio-btn" onclick="nextTrack()">▶</button>
    </div>

</div>

<!-- Hidden Background Audio Player Element -->
<audio id="bgMusic" src="wedding-background-track.mp3" loop></audio>

<script>
    const gate = document.getElementById('templeGate');
    const audio = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    
    // Tracks state of background playback
    let isPlaying = false;

    // Handles slow opening and auto-plays music smoothly
    function handleGateClick() {
        gate.classList.add('is-open');
        
        // Starts background track upon opening interaction
        if(!isPlaying) {
            playMusic();
        }
    }

    // Fully resets animation so guests can view it opening again
    function resetInvitation() {
        document.getElementById('mainContent').scrollTop = 0;
        gate.classList.remove('is-open');
    }

    // Music Player Controller Utilities
    function playMusic() {
        audio.play().then(() => {
            isPlaying = true;
            playPauseBtn.innerText = "⏸";
        }).catch(err => console.log("Audio play blocked by browser policies until direct click."));
    }

    function togglePlayPause() {
        if (isPlaying) {
            audio.pause();
            playPauseBtn.innerText = "▶";
            isPlaying = false;
        } else {
            playMusic();
        }
    }

    function nextTrack() {
        console.log("Next track clicked.");
        // Implement music source rotation here if you have multiple audio assets
    }

    function prevTrack() {
        console.log("Previous track clicked.");
        // Implement music source rotation reversal here
    }
</script>

</body>
</html>
