<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishita & Adithya's Wedding Invitation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: #fcf9f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* Fixed Frame for Invitation Layout */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border-radius: 16px;
            overflow: hidden;
        }
        .slide-item {
            display: none;
            width: 100%;
        }
        .slide-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Buttons Toolbar Design */
        .slider-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid #f0e9dc;
        }
        .control-btn {
            background-color: #3d5a45;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            min-width: 95px;
            text-align: center;
        }
        .control-btn:hover {
            background-color: #2b3f30;
        }
        /* RSVP Link Area */
        .rsvp-footer {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 24px;
            z-index: 10;
        }
        .rsvp-link-btn {
            display: inline-block;
            background-color: #bc903c;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(188, 144, 60, 0.3);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .rsvp-link-btn:hover {
            background-color: #9e772f;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Main Card Display Frame -->
    <div class="slider-container">
        <!-- Card 1: Traditional Temple Cover -->
        <div class="slide-item">
            <img src="./image_w6JIXe.png" alt="Traditional Temple Cover">
        </div>
        
        <!-- Card 2: Maapillai Azhaippu -->
        <div class="slide-item">
            <img src="./image_Vp6zYa.png" alt="Maapillai Azhaippu Event">
        </div>

        <!-- Card 3: Main Wedding Muhurtham -->
        <div class="slide-item">
            <img src="./image_U3jU8C.png" alt="Main Wedding Card">
        </div>

        <!-- Toolbar Back/Pause/Forward Controls -->
        <div class="slider-controls">
            <button class="control-btn" onclick="navigateSlides(-1)">◀ Back</button>
            <button class="control-btn" id="playPauseBtn" onclick="toggleAutoplay()">⏸ Pause</button>
            <button class="control-btn" onclick="navigateSlides(1)">Next ▶</button>
        </div>
    </div>

    <!-- RSVP Anchor Link Section -->
    <div class="rsvp-footer">
        <a href="https://withjoy.com" target="_blank" rel="noopener noreferrer" class="rsvp-link-btn">
            Click Here to RSVP
        </a>
    </div>

    <!-- Slider Mechanism Script -->
    <script>
        let currentSlide = 0;
        let autoplayTimer;
        let isAutoplayActive = true;
        const slideDuration = 4000; 

        const allSlides = document.getElementsByClassName("slide-item");
        const playPauseButton = document.getElementById("playPauseBtn");

        function renderSlide() {
            for (let i = 0; i < allSlides.length; i++) {
                allSlides[i].style.display = "none";  
            }
            if (currentSlide >= allSlides.length) { currentSlide = 0; }
            if (currentSlide < 0) { currentSlide = allSlides.length - 1; }
            
            allSlides[currentSlide].style.display = "block";  
        }

        function triggerNextSlide() {
            currentSlide++;
            renderSlide();
        }

        function startAutoplay() {
            autoplayTimer = setInterval(triggerNextSlide, slideDuration);
        }

        function clearAutoplay() {
            clearInterval(autoplayTimer);
        }

        function navigateSlides(direction) {
            clearAutoplay();
            currentSlide += direction;
            renderSlide();
            if (isAutoplayActive) {
                startAutoplay();
            }
        }

        function toggleAutoplay() {
            if (isAutoplayActive) {
                clearAutoplay();
                playPauseButton.innerHTML = "▶ Play";
                isAutoplayActive = false;
            } else {
                currentSlide++;
                renderSlide();
                startAutoplay();
                playPauseButton.innerHTML = "⏸ Pause";
                isAutoplayActive = true;
            }
        }

        // Run on Page Load
        renderSlide();
        startAutoplay();
    </script>

</body>
</html>
